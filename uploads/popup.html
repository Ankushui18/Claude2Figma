<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="surface surface--popup">
    <header class="appbar">
      <div class="appbar__brand">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" class="appbar__icon" role="img" aria-label="Claude Design to Figma"> <rect x="0" y="0" class="appbar__icon" rx="150" fill="#000000"/> <path d="M 300 145 H 207.5 A 77.5 77.5 0 0 0 207.5 300 H 300 Z" fill="#D97757"/> <path d="M 300 145 H 392.5 A 77.5 77.5 0 0 1 392.5 300 H 300 Z" fill="#FF8C69"/> <path d="M 207.5 300 H 300 V 455 H 207.5 A 77.5 77.5 0 0 1 207.5 300 Z" fill="#FFC9B0"/> <circle cx="377.5" cy="377.5" r="77.5" fill="#FFFFFF"/> </svg>
        <strong>Claude Design Importer</strong>
      </div>
      <div class="row">
        <button type="button" class="lang" id="top-lang" aria-label="language">🇧🇷</button>
        <button type="button" class="icon-btn" id="top-account" aria-label="account">⚙️</button>
      </div>
    </header>
    <main id="root" class="screens">
      <section data-screen="booting"></section>
      <section data-screen="login"></section>
      <section data-screen="home"></section>
      <section data-screen="decks"></section>
      <section data-screen="capturing"></section>
      <section data-screen="success"></section>
      <section data-screen="account"></section>
      <section data-screen="error"></section>
      <section data-screen="paywall"></section>
      <section data-screen="plans"></section>
      <section data-screen="how-to"></section>
    </main>
    <nav class="tabbar">
      <button type="button" class="tabbar__item" id="tab-home">Home</button>
      <button type="button" class="tabbar__item" id="tab-decks">Decks</button>
      <button type="button" class="tabbar__item" id="tab-account">Conta</button>
      <button type="button" class="tabbar__item" id="tab-how-to">Como usar</button>
    </nav>
    <script src="popup.js"></script>
  </body>
</html>
