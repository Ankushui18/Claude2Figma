name: release-artifacts

# Builds the Chrome extension and Figma plugin packages for a release and
# attaches them to the GitHub release. Runs when a v* tag is pushed, and can
# be dispatched manually to backfill existing releases (e.g. v1.8.0).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName -q '.[0].tagName')
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "Backfilling release: ${TAG}"
          fi

      - name: Package extension & Figma plugin
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          ( cd claude2figma/extension && zip -r "$GITHUB_WORKSPACE/claude2figma-extension-${TAG}.zip" . -x '*.DS_Store' )
          ( cd claude2figma/figma-plugin && zip -r "$GITHUB_WORKSPACE/claude2figma-figma-plugin-${TAG}.zip" . -x '*.DS_Store' )
          unzip -l "$GITHUB_WORKSPACE/claude2figma-extension-${TAG}.zip"
          unzip -l "$GITHUB_WORKSPACE/claude2figma-figma-plugin-${TAG}.zip"

      - name: Attach packages to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          gh release upload "$TAG" \
            "claude2figma-extension-${TAG}.zip" \
            "claude2figma-figma-plugin-${TAG}.zip" \
            --repo "$GITHUB_REPOSITORY" --clobber
